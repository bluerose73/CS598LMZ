# Model architecture: decoder | FiD
architecture: decoder

# Task: line-completion | api-completion
#   This parameter determines the stopping criterion for the generation process.
#   For line-completion, the model will stop after generating a single line of code.
task: line-completion

# Inference engine: vllm | transformers
#   vLLM is fast, but it doesn't support FiD.
engine: vllm

# Model name or path
model: Qwen/Qwen2.5-Coder-1.5B

# [ INPUT AND OUTPUT ]

# Paths to the input files
# Files should be generated by our prompt builder using RAG
code-chunks-path: data/mock/code-chunks.jsonl
unfinished-code-with-context-path: data/mock/unfinished-code.jsonl

# Paths to the output files
output-path: data/completions.jsonl

# [ DECODER ]

# Prompt format: repocoder-python | qwen-repo-level-completion
prompt-format: qwen-repo-level-completion

# [ Generation parameters ]

max-new-tokens: 128